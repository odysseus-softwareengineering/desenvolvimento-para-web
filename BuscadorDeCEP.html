
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Buscador de CEP utilizando a API ViaCEP.">
  <title>Buscador de CEP</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>Buscador de CEP</h1>
      <p>Digite um CEP para consultar o endereço.</p>
    </header>

    <form id="formulario">
      <label for="cep">CEP</label>

      <div class="campo-busca">
        <input
          type="text"
          id="cep"
          name="cep"
          placeholder="Ex.: 01001000"
          inputmode="numeric"
          maxlength="9"
          autocomplete="postal-code"
          required
        >

        <button type="submit" id="botao-buscar">
          Buscar
        </button>
      </div>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="secao-resultado" aria-labelledby="titulo-resultado" hidden>
      <h2 id="titulo-resultado">Endereço encontrado</h2>
      <dl id="resultado"></dl>
    </section>

    <section aria-labelledby="titulo-historico">
      <h2 id="titulo-historico">Histórico de buscas</h2>
      <ul id="historico">
        <li>Nenhuma pesquisa realizada.</li>
      </ul>
    </section>
  </main>
</body>
</html>
